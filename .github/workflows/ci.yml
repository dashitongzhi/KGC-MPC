name: CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pandas scikit-learn matplotlib

      - name: Run offline smoke tests
        run: python -B tests/smoke_test.py

      - name: Regenerate manuscript figures and tables
        run: python -B src/make_assets.py

      - name: Verify manuscript and data parity
        run: python -B src/verify_paper.py
